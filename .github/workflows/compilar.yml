name: Compilar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TiempoControlFinal.zip'
      - '.github/workflows/compilar.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          unzip TiempoControlFinal-1.zip

      - name: Compilar aplicación
        run: |
          cd TiempoControlFinal
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TiempoControl-debug
          path: TiempoControlFinal/app/build/outputs/apk/debug/app-debug.apk
